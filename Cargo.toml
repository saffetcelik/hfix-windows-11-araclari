[package]
description = "HFix Windows 11 Araclari: Windows 11 icin bakim ve hizlandirma araci"
license = "MIT"
repository = "https://github.com/saffetcelik/hfix-windows-11-araclari"
name = "hfixwin11"
version = "1.0.5"
edition = "2021"

[[bin]]
name = "HFixWin11"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui_extras = "0.29"
sysinfo = "0.30"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
sha2 = "0.10"
serde_json = "1"

[profile.release]
opt-level = 3
strip = true
panic = "abort"

[patch.crates-io]
webbrowser = { path = "webbrowser-stub" }
